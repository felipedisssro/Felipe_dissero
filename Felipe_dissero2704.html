<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Loja</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Promoções</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Minha Conta</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="row align-items-center mb-5">
        <div class="col-md-6 text-center">
            <img src="img/notebook.png" class="img-fluid rounded shadow">
        </div>

        <div class="col-md-6">
            <h2>Notebook <span class="text-primary">Asus</span></h2>
            <h3 class="text-success">$599.00</h3>

            <p class="text-muted">
                Notebook gamer com RTX 4060, i7, 16GB RAM e 1TB SSD
            </p>

            <div class="d-flex gap-2">
                <button class="btn btn-success">Mais Detalhes</button>
                <button class="btn btn-warning">Adicionar ao carrinho</button>
            </div>
        </div>
    </div>

    <hr>

    <div class="row text-center mt-4">

        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <img src="img/teclado.png" class="card-img-top p-3">
                <div class="card-body">
                    <h5 class="card-title">Teclado Mecânico</h5>
                    <p class="text-muted">Compacto e rápido</p>
                    <h6 class="text-success">$99,00</h6>
                    <button class="btn btn-warning w-100 mt-2">Adicionar</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <img src="img/headset.png" class="card-img-top p-3">
                <div class="card-body">
                    <h5 class="card-title">Headset Gamer</h5>
                    <p class="text-muted">Som imersivo</p>
                    <h6 class="text-success">$69,00</h6>
                    <button class="btn btn-warning w-100 mt-2">Adicionar</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <img src="img/gpu.png" class="card-img-top p-3">
                <div class="card-body">
                    <h5 class="card-title">Placa de Vídeo</h5>
                    <p class="text-muted">Alta performance</p>
                    <h6 class="text-success">$299,00</h6>
                    <button class="btn btn-warning w-100 mt-2">Adicionar</button>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
